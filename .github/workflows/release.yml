name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Both run the same single build job: a pull request gets a read-only token,
# and only a tag gets what attestation and publishing need.
jobs:
  check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
