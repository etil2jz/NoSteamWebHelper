[package]
name = "umpdc"
version = "7.0.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
publish = false

[lib]
crate-type = ["cdylib"]
# cdylib only: there is no host-side code to unit-test, and a doctest or test
# harness would need std, which this crate deliberately does without.
test = false
doctest = false

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# The DLL lives inside Steam and has no std to unwind with: panic paths must not
# exist in the first place, and aborting is what remains if one slips through.
[profile.dev]
panic = "abort"
debug = "line-tables-only"

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
# Done by the linker instead, see build.rs.
strip = "none"
